apiVersion: 1

providers:
  - name: Atlas Dashboards
    orgId: 1
    folder: Atlas
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/atlas/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
