[database]
path = /opt/atlas/security.db
wal_mode = true
busy_timeout_ms = 5000
batch_size = 50
flush_interval_sec = 5

[collector]
queue_max_size = 10000
log_resume_file = /opt/atlas/security/collector_cursor.json
log_dir = /var/log/nginx
fail2ban_log = /var/log/fail2ban.log
journald_follow = true

[journald]
units = ssh.service,sshd.service,fail2ban.service,nginx.service,atlas-collector.service
include_kernel = true
kernel_prefix = NFT DROP

[detector]
poll_interval_sec = 10
cursor_file = /opt/atlas/security/detector_cursor.json
enabled = true
